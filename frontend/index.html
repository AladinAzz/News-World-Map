<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgeriaPulse 2.0 - Interactive 3D News Globe</title>
    <meta name="description" content="Interactive 3D geospatial visualization of Algerian news. Explore events across wilayas and the world.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-content">
                <h1 data-i18n="title">AlgeriaPulse 2.0</h1>
                <p id="status-text" data-i18n="fetching">Fetching latest news...</p>
            </div>
            <div id="lang-switcher">
                <button id="btn-en" class="lang-btn active" data-lang="en">EN</button>
                <button id="btn-ar" class="lang-btn" data-lang="ar">AR</button>
            </div>
        </header>

        <main>
            <div id="globe-container">
                <canvas id="globe"></canvas>
                <div id="tooltip" class="hidden"></div>
            </div>
            
            <div id="controls">
                <button id="reset-btn" data-i18n="resetView">Reset View</button>
                <button id="play-pause-btn" data-i18n="pause">Pause</button>
                <div class="control-group">
                    <label data-i18n="speed">Speed</label>
                    <input type="range" id="speed-slider" min="0" max="150" value="0">
                </div>
                <div id="stats">
                    <span id="event-count">0</span> <span data-i18n="events">Events</span>
                </div>
            </div>
        </main>

        <footer id="event-list-panel" class="hidden">
            <div class="panel-header">
                <h2 id="selected-location" data-i18n="location">Location</h2>
                <button id="close-panel">×</button>
            </div>
            <div id="event-items"></div>
        </footer>

        <div id="timeline-container">
            <div class="timeline-header">
                <span id="current-range" data-i18n="timelineRange">Timeline Range</span>
            </div>
            <div class="range-slider">
                <div class="slider-track"></div>
                <input type="range" id="timeline-start" min="0" max="100" value="0">
                <input type="range" id="timeline-end" min="0" max="100" value="100">
            </div>
            <div class="timeline-labels">
                <span id="start-date">-</span>
                <span id="end-date">-</span>
            </div>
        </div>
    </div>

    <script type="module" src="main.js?v=2"></script>
</body>
</html>
